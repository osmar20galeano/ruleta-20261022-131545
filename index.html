<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de la Suerte</title>
  <style>
    :root {
      --bg1: #1a1033;
      --bg2: #3b1c6b;
      --accent: #ffd23f;
      --text: #ffffff;
      --size: min(88vw, 460px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px 16px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1) 70%);
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
      background: linear-gradient(90deg, #ffd23f, #ff6b9d, #4ecdc4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    .subtitle {
      margin-top: -18px;
      opacity: 0.75;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      text-align: center;
    }

    .wheel-wrap {
      position: relative;
      width: var(--size);
      height: var(--size);
    }

    /* Puntero superior */
    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 40px solid var(--accent);
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
      z-index: 3;
    }

    .wheel-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 12px;
      background: linear-gradient(145deg, #ffe680, #c99a00);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(255, 210, 63, 0.35),
        inset 0 0 10px rgba(0, 0, 0, 0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      transform: rotate(0deg);
      will-change: transform;
    }

    .hub {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18%;
      height: 18%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff6c9, #ffd23f 45%, #b8860b);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), inset 0 -3px 6px rgba(0, 0, 0, 0.25);
      z-index: 2;
    }

    .spin-btn {
      padding: 16px 56px;
      font-size: clamp(1.1rem, 4.5vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1a1033;
      background: linear-gradient(135deg, #ffd23f, #ff9f1c);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 0 #b86e00, 0 14px 30px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .spin-btn:hover:not(:disabled) { filter: brightness(1.08); }

    .spin-btn:active:not(:disabled) {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b86e00, 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .spin-btn:disabled {
      cursor: not-allowed;
      filter: grayscale(0.6) brightness(0.8);
    }

    /* Mensaje de resultado */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(10, 5, 25, 0.7);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .overlay.show { opacity: 1; pointer-events: auto; }

    .modal {
      width: min(100%, 360px);
      padding: 32px 24px;
      text-align: center;
      border-radius: 24px;
      background: #ffffff;
      color: #1a1033;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      transform: scale(0.8);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .overlay.show .modal { transform: scale(1); }

    .modal p { font-size: 1rem; opacity: 0.7; }

    .result-badge {
      display: inline-block;
      margin: 16px 0 24px;
      padding: 14px 32px;
      border-radius: 16px;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .close-btn {
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: #3b1c6b;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(59, 28, 107, 0.4);
    }

    .history {
      font-size: 0.95rem;
      opacity: 0.8;
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Ruleta de la Suerte</h1>
  <p class="subtitle">Presioná el botón y probá tu suerte</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel-frame">
      <canvas id="wheel" width="800" height="800"></canvas>
    </div>
    <div class="hub"></div>
  </div>

  <button class="spin-btn" id="spinBtn">Girar</button>
  <p class="history" id="history"></p>

  <div class="overlay" id="overlay">
    <div class="modal">
      <p>¡La ruleta cayó en!</p>
      <div class="result-badge" id="resultBadge"></div>
      <br>
      <button class="close-btn" id="closeBtn">Aceptar</button>
    </div>
  </div>

  <script>
    const sections = [
      { label: "1",       color: "#ff4d6d" },
      { label: "Premio",  color: "#ff9f1c" },
      { label: "2",       color: "#ffd23f" },
      { label: "x2",      color: "#2ec4b6" },
      { label: "3",       color: "#3a86ff" },
      { label: "Bonus",   color: "#8338ec" },
      { label: "4",       color: "#06d6a0" },
      { label: "Suerte",  color: "#ef476f" },
      { label: "5",       color: "#118ab2" },
      { label: "Jackpot", color: "#f15bb5" }
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const overlay = document.getElementById("overlay");
    const resultBadge = document.getElementById("resultBadge");
    const closeBtn = document.getElementById("closeBtn");
    const historyEl = document.getElementById("history");

    const n = sections.length;
    const arc = (2 * Math.PI) / n;
    let rotation = 0; // grados acumulados
    let spinning = false;
    const history = [];

    function drawWheel() {
      const size = canvas.width;
      const c = size / 2;
      const r = c - 4;
      ctx.clearRect(0, 0, size, size);

      sections.forEach((s, i) => {
        // La sección 0 empieza arriba (-90°)
        const start = i * arc - Math.PI / 2;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(c, c);
        ctx.arc(c, c, r, start, end);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.stroke();

        // Texto
        ctx.save();
        ctx.translate(c, c);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold " + (s.label.length > 2 ? 44 : 64) + "px 'Segoe UI', system-ui, sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.45)";
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
        ctx.fillText(s.label, r - 36, 0);
        ctx.restore();
      });

      // Brillo interior
      const g = ctx.createRadialGradient(c, c, r * 0.2, c, c, r);
      g.addColorStop(0, "rgba(255,255,255,0.12)");
      g.addColorStop(1, "rgba(0,0,0,0.18)");
      ctx.beginPath();
      ctx.arc(c, c, r, 0, 2 * Math.PI);
      ctx.fillStyle = g;
      ctx.fill();
    }

    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;

      const sectionDeg = 360 / n;
      const target = Math.floor(Math.random() * n);
      // Posición aleatoria dentro de la sección (evita caer justo en el borde)
      const offsetInSection = sectionDeg * (0.15 + Math.random() * 0.7);
      // Ángulo donde el centro "objetivo" queda bajo el puntero (arriba)
      const targetAngle = 360 - (target * sectionDeg + offsetInSection);
      const current = ((rotation % 360) + 360) % 360;
      let delta = targetAngle - current;
      if (delta < 0) delta += 360;
      const turns = 5 + Math.floor(Math.random() * 3); // 5 a 7 vueltas
      const startRot = rotation;
      const finalRot = rotation + turns * 360 + delta;
      const duration = 5000 + Math.random() * 1500;
      const t0 = performance.now();

      function frame(now) {
        const t = Math.min((now - t0) / duration, 1);
        rotation = startRot + (finalRot - startRot) * easeOutQuart(t);
        canvas.style.transform = "rotate(" + rotation + "deg)";
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          rotation = finalRot;
          finish(target);
        }
      }
      requestAnimationFrame(frame);
    }

    function finish(index) {
      const s = sections[index];
      resultBadge.textContent = s.label;
      resultBadge.style.background = s.color;
      overlay.classList.add("show");

      history.unshift(s.label);
      if (history.length > 5) history.pop();
      historyEl.textContent = "Últimos resultados: " + history.join(" · ");

      spinning = false;
      spinBtn.disabled = false;
    }

    function closeModal() {
      overlay.classList.remove("show");
    }

    spinBtn.addEventListener("click", spin);
    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeModal();
    });

    drawWheel();
  </script>
</body>
</html>
